<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <title>Facial Game</title>
  <style>
    body {
      background: #FFF;
      display: flex;
      justify-content: left;
      align-items: left;
      height: 100vh;
      margin: 0;
    }
    #game-container {
      width: 900px;
      height: 750px;
      max-width: 100%;
      aspect-ratio: 6 / 5;
      background: #FFF;
      border-radius: 12px;
      overflow: hidden;
    }
    object {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script src="ruffle.js"></script>

  <div id="game-container">
    <object type="application/x-shockwave-flash" data="facial.swf">
      <param name="movie" value="facial.swf">
    </object>
  </div>
</body>
</html>
